title: Keep package.json and package-lock.json in sync for every dependency change
rule: >-
  Any addition, removal, or update of a dependency in package.json must be
  accompanied by the corresponding regenerated package-lock.json entry. Do not
  hand-edit the lockfile, and do not reference third-party libraries via inline
  CDN <script> tags that bypass the declared dependency graph. This keeps the
  install reproducible and auditable.
severity: medium
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      {
        "dependencies": {
          "@vercel/analytics": "^1.5.0",
          "some-new-lib": "^2.0.0"
        }
      }
      // package-lock.json unchanged, no entry for some-new-lib
    isCorrect: false
  - snippet: |-
      {
        "dependencies": {
          "@vercel/analytics": "^1.5.0",
          "some-new-lib": "^2.0.0"
        }
      }
      // package-lock.json regenerated with a matching some-new-lib entry
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
