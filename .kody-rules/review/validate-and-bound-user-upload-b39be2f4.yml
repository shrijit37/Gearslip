title: Validate and bound user-uploaded images before decoding
rule: >-
  Any endpoint accepting image uploads (python-multipart UploadFile) must
  enforce an explicit byte-size limit, an allow-list of content types, and must
  guard the decoder against decompression bombs before the bytes reach
  OpenCV/rapidocr/numpy. Read at most MAX_UPLOAD_BYTES + 1 bytes, reject
  oversized payloads with 413 and unsupported types with 415, set Pillow's
  Image.MAX_IMAGE_PIXELS, verify the image, and downscale before OCR. Never pass
  an unbounded UploadFile stream straight into Image.open/np.array/cv2.imdecode,
  since a crafted image can exhaust memory or CPU in the ONNX/OCR pipeline.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |
      MAX_UPLOAD_BYTES = 10 * 1024 * 1024
      ALLOWED_TYPES = {"image/png", "image/jpeg", "image/webp"}
      Image.MAX_IMAGE_PIXELS = 25_000_000

      @app.post("/ocr")
      async def ocr(file: UploadFile = File(...)):
          if file.content_type not in ALLOWED_TYPES:
              raise HTTPException(415, "unsupported media type")
          data = await file.read(MAX_UPLOAD_BYTES + 1)
          if len(data) > MAX_UPLOAD_BYTES:
              raise HTTPException(413, "file too large")
          try:
              img = Image.open(io.BytesIO(data))
              img.verify()
          except (UnidentifiedImageError, Image.DecompressionBombError):
              raise HTTPException(400, "invalid image")
          return run_ocr(np.asarray(img.convert("RGB")))
    isCorrect: true
  - snippet: |
      @app.post("/ocr")
      async def ocr(file: UploadFile = File(...)):
          # no size limit, no content-type check, no decoder guard
          img = Image.open(file.file)
          return run_ocr(np.asarray(img))
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
