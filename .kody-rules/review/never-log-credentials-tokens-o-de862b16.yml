title: Never log credentials, tokens or session material
rule: >-
  Do not write passwords, password hashes, session tokens, session cookies,
  Authorization/Cookie headers, OTP codes, API keys or full request bodies
  containing them to logs or error responses. Log only non-sensitive identifiers
  (userId, requestId, route, status, duration) and redact sensitive header
  fields before any logging middleware emits them. Error responses must return
  generic messages rather than propagating raw auth errors, secrets, or database
  connection strings.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      app.use("*", async (c, next) => {
        await next();
        console.log("request", {
          headers: Object.fromEntries(c.req.raw.headers),
          body: await c.req.text(),
          session: c.get("session"),
        });
      });
    isCorrect: false
  - snippet: >-
      const SENSITIVE_HEADERS = new Set(["authorization", "cookie",
      "set-cookie", "x-api-key"]);


      function redactHeaders(headers: Headers): Record<string, string> {
        return Object.fromEntries(
          [...headers.entries()].map(([k, v]) => [k, SENSITIVE_HEADERS.has(k.toLowerCase()) ? "[redacted]" : v]),
        );
      }


      app.use("*", async (c, next) => {
        const startedAt = Date.now();
        await next();
        console.log(JSON.stringify({
          requestId: c.get("requestId"),
          method: c.req.method,
          path: c.req.path,
          status: c.res.status,
          durationMs: Date.now() - startedAt,
          headers: redactHeaders(c.req.raw.headers),
        }));
      });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
