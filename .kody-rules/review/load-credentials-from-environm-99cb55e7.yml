title: Load credentials from environment or secret store, never inline
rule: >-
  API keys, tokens, signing secrets, database URLs with passwords, and webhook
  secrets used by the `/api/invoke` and `/health` services must be read at
  startup from environment variables or a secret manager (via
  `std::env::var`/`std::env::var_os` or a config crate backed by env), never
  hardcoded as string literals, default struct fields, test fixtures committed
  to the repo, or embedded in `Cargo.toml`. Fail fast with a typed error when a
  required secret is absent, and ensure the value is never written to logs or
  returned by handlers — redact it in any `Debug`/`Display` output.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      const API_KEY: &str = "sk_live_51H8xQ2abcDEF";
      let token = API_KEY.to_string();
    isCorrect: false
  - snippet: >-
      let token = std::env::var("API_KEY").map_err(|_|
      AppError::MissingSecret("API_KEY"))?;

      tracing::debug!(secret = "API_KEY", "credential loaded");
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
