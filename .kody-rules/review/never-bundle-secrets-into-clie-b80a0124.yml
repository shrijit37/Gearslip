title: Never bundle secrets into client code or commit .env files
rule: >-
  This is a static Vite/React app: everything imported into the bundle is
  public. Only read configuration from `import.meta.env.VITE_*` variables, and
  only for non-sensitive values (public URLs, feature flags, analytics IDs).
  Never hardcode or read API keys, tokens, passwords, private endpoints, or
  signing secrets in `src/**` or `vite.config.*` (Vite also inlines
  `process.env` values used in the config). Keep real values out of the repo:
  commit a `.env.example` with placeholder names, add `.env`, `.env.local`, and
  `.env.*.local` to `.gitignore`, and never put a secret in a variable whose
  name lacks the `VITE_` prefix and then import it into app code.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      // .env.local (gitignored)
      VITE_API_BASE_URL=https://api.example.com
      // src/api.js
      const baseUrl = import.meta.env.VITE_API_BASE_URL;
      export const getProjects = () => fetch(`${baseUrl}/projects`);
    isCorrect: true
  - snippet: |-
      // src/analytics.js
      const STRIPE_SECRET_KEY = "sk_live_51H8x...";
      await fetch("https://api.stripe.com/v1/charges", {
        headers: { Authorization: `Bearer ${STRIPE_SECRET_KEY}` },
      });
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
