title: Keep secrets and privileged logic server-only in Next.js
rule: >-
  Never read secret environment variables (any process.env value that is not
  explicitly intended to be public) from a Client Component, or from any module
  that can be imported into the client bundle. Any module that touches secrets,
  service-role keys, database clients, or privileged third-party SDKs must start
  with `import 'server-only'` and be consumed only from Server Components, Route
  Handlers, or Server Actions. Public configuration must use explicitly public
  variables only (e.g. NEXT_PUBLIC_* for non-sensitive values), and secrets must
  never be inlined into JSX, props, or data passed to a Client Component.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      // app/lib/payments.ts
      import 'server-only';

      export async function chargeCustomer(amount: number) {
        const res = await fetch('https://api.stripe.com/v1/charges', {
          method: 'POST',
          headers: { Authorization: `Bearer ${process.env.STRIPE_SECRET_KEY}` },
          body: new URLSearchParams({ amount: String(amount) }),
        });
        return res.json();
      }
    isCorrect: true
  - snippet: |-
      // app/components/CheckoutButton.tsx
      'use client';

      export function CheckoutButton() {
        // Secret is inlined into the client bundle
        const key = process.env.STRIPE_SECRET_KEY;
        return <button onClick={() => fetch('/api/charge', { headers: { Authorization: key! } })}>Pay</button>;
      }
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
