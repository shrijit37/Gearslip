title: Never hardcode secrets or API keys in client code
rule: >-
  Do not commit API keys, tokens, signing secrets, or credentials in any React
  Native / Expo source, config, or JSON file. Client bundles are trivially
  reverse-engineered, so anything shipped in `app/`, `src/`, or `app.json` must
  be treated as public. Read secrets at runtime from `expo-constants`
  (`Constants.expoConfig?.extra`) or another injected configuration source, and
  keep only non-sensitive, public values in the repo. If a value must stay
  secret, it belongs behind a backend call, not in this app.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      // app/config.ts
      const API_KEY = "sk_live_51H8xQ2eZvKYlo2C";
      export const fetchContent = () =>
        fetch("https://api.example.com/videos", {
          headers: { Authorization: `Bearer ${API_KEY}` },
        });
    isCorrect: false
  - snippet: |-
      // app/config.ts
      import Constants from "expo-constants";

      const apiKey = Constants.expoConfig?.extra?.apiKey as string | undefined;

      export const fetchContent = () => {
        if (!apiKey) throw new Error("Missing apiKey in Expo config extra");
        return fetch("https://api.example.com/videos", {
          headers: { Authorization: `Bearer ${apiKey}` },
        });
      };
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
