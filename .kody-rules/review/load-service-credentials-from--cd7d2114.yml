title: Load service credentials from environment, never hardcode
rule: >-
  API keys and other credentials (e.g. OPENAI_API_KEY for the optional openai
  extra) must be read at runtime from environment variables or an injected
  config object. Never hardcode secrets in source, defaults, tests, or
  notebooks. When a required secret is missing, fail fast with a clear error
  instead of falling back to a placeholder or empty string.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      client = OpenAI(api_key="sk-live-abc123hardcoded")

      def extract(text):
          return client.chat.completions.create(model="gpt-4o-mini", messages=[{"role":"user","content":text}])
    isCorrect: false
  - snippet: |-
      import os
      from openai import OpenAI

      def get_client():
          api_key = os.environ.get("OPENAI_API_KEY")
          if not api_key:
              raise RuntimeError("OPENAI_API_KEY is not set")
          return OpenAI(api_key=api_key)
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
