title: Keep secrets out of source and out of logs
rule: >-
  Do not hardcode credentials, tokens, session identifiers, or private paths in
  source or config committed to the repo (including the Electron GUI workspaces
  and the control-center workspace). Read secrets from environment variables or
  a config file outside the repo, and when reading from disk set restrictive
  permissions (0600). Never write secrets, full IPC/WebSocket payloads, or raw
  D-Bus messages to console/logger output; log identifiers and outcomes instead
  of payload contents.
severity: high
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      const DBUS_TOKEN = 'a1b2c3d4-secret-token';

      console.log('sending payload', JSON.stringify(message));
    isCorrect: false
  - snippet: >-
      const dbusToken = process.env.TOUCHBAR_DBUS_TOKEN;

      if (!dbusToken) throw new Error('TOUCHBAR_DBUS_TOKEN is not configured');


      logger.debug('dispatching message', { type: message.type, id: message.id
      });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
