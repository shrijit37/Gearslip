title: Load all secrets from validated environment variables, never hardcode them
rule: >-
  Every credential, API key, token, and connection string (including Redis
  passwords and upstream market-data API keys) must be read from process.env at
  runtime. Never commit .env files or inline literal secrets in source. Validate
  the required environment variables once at startup with a Zod schema and fail
  fast with a clear error when a value is missing or malformed, so the app never
  boots into an insecure half-configured state. Use a single shared env module
  instead of scattering process.env reads across the workspace, and use
  NEXT_PUBLIC_/VITE_-style prefixes only for values that are genuinely safe to
  expose to clients.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: >-
      const redis = new Redis({ host: "cache.prod.internal", port: 6379,
      password: "s3cr3t-redis-pw" });

      const apiKey = "sk-live-9f2c...";
    isCorrect: false
  - snippet: |-
      import { z } from "zod";

      const envSchema = z.object({
        REDIS_URL: z.string().url(),
        MARKET_DATA_API_KEY: z.string().min(1),
        NODE_ENV: z.enum(["development", "test", "production"]),
      });

      export const env = envSchema.parse(process.env);

      const redis = new Redis(env.REDIS_URL);
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
