title: Never hardcode secrets or API keys in client source
rule: >-
  Do not commit API keys, tokens, private credentials, or analytics secret
  values directly in source files. All sensitive configuration must be read from
  environment variables (e.g. process.env.* / import.meta.env.*) or a runtime
  config loader, and only public-safe values may be exposed to the client
  bundle. Hardcoded secrets in JS/TS/HTML are immediately extractable from
  shipped assets and must be rejected.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      const MAPS_API_KEY = "AIzaSyD-1234567890abcdef";
      fetch(`https://maps.example.com/api?key=${MAPS_API_KEY}`);
    isCorrect: false
  - snippet: |-
      const MAPS_API_KEY = process.env.NEXT_PUBLIC_MAPS_API_KEY;
      fetch(`https://maps.example.com/api?key=${MAPS_API_KEY}`);
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
