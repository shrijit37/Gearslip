title: Never log or expose secrets, tokens, or PII
rule: >-
  Do not pass tokens, refresh tokens, authorization headers, cookies, passwords,
  email addresses, phone numbers, or full API response bodies containing user
  data to console.log/warn/error, to a crash reporter, or to any
  analytics/telemetry call. Log only non-identifying context (e.g. status codes,
  route names, opaque IDs). Debug logging that includes request/response
  payloads must be gated behind a __DEV__ check and must redact sensitive fields
  before printing.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      if (__DEV__) {
        console.log('[api] request failed', { route, status: res.status });
      }
    isCorrect: true
  - snippet: |-
      console.log('login response', response);
      console.log('auth header', `Bearer ${token}`);
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
