title: Keep MongoDB credentials and driver usage server-only
rule: >-
  Database credentials (e.g. MONGODB_URI) and the mongodb/youtubei.js drivers
  must only be read or imported from server-side code. Never expose secrets
  through NEXT_PUBLIC_* variables, and add `import 'server-only'` (or keep the
  module under app/api, server actions, or lib/server) in any file that reads
  process.env secrets so an accidental client import fails at build time. Client
  components ('use client') must receive data via props, route handlers, or
  server actions, never by importing the DB module directly.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      // app/api/catalog/route.ts
      const uri = process.env.NEXT_PUBLIC_MONGODB_URI;
      const client = new MongoClient(uri!);
    isCorrect: false
  - snippet: |-
      // lib/server/db.ts
      import 'server-only';
      import { MongoClient } from 'mongodb';

      const uri = process.env.MONGODB_URI;
      if (!uri) throw new Error('MONGODB_URI is not configured');
      export const client = new MongoClient(uri);
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
