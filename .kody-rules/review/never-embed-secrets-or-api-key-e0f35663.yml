title: Never embed secrets or API keys in client code — use VITE_ env vars only
rule: >-
  This is a browser-only Vite app, so anything bundled into the client is
  public. Do not hardcode API keys, tokens, JWT secrets, or credentials in
  .ts/.tsx/.json source files, and do not prefix sensitive values with VITE_.
  Read configuration exclusively via import.meta.env (e.g.
  import.meta.env.VITE_API_BASE_URL) and declare every used variable in a
  committed .env.example with placeholder values; keep real .env files
  git-ignored. Secrets that must stay private (API secrets, DB URIs, signing
  keys) must never be referenced from frontend code at all — proxy such calls
  through a backend.


  Correct: `const baseURL = import.meta.env.VITE_API_BASE_URL;`

  Incorrect: `const API_KEY = "sk_live_9f8a...";` or `axios.get(url, { headers:
  { Authorization: "Bearer eyJhbGciOi..." } })`
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      // src/lib/api.ts
      export const api = axios.create({
        baseURL: import.meta.env.VITE_API_BASE_URL,
        withCredentials: true,
      });
    isCorrect: true
  - snippet: |-
      // src/lib/api.ts
      const API_KEY = "sk_live_9f8a7b6c5d4e3f2a1b";
      const JWT_SECRET = "super-secret-signing-key";

      export const api = axios.create({
        baseURL: "https://api.internal.example.com",
        headers: { Authorization: `Bearer ${API_KEY}` },
      });
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
