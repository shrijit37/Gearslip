title: Load all credentials from Cloudflare Worker bindings, never hardcode them
rule: >-
  Secrets (Telegram bot token, S3 access key/secret, signing keys, admin tokens)
  must be read exclusively from the Worker `env` object (bindings/secrets
  declared in wrangler config) and never inlined as string literals, default
  values, or committed config. Every module that needs a secret must accept the
  binding through the Worker `Env` interface, validate it is present at first
  use, and fail fast with a generic error that does not echo the value. Do not
  log, return, or embed secret values in responses, D1 rows, or KV entries;
  store only non-reversible references (e.g. hashed/truncated identifiers) when
  persistence is required.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      const TELEGRAM_BOT_TOKEN = "7123456789:AAH8xkQ2mS3cretTokenValue";
      const S3_SECRET = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY";

      export async function handle(request: Request) {
        return fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe`);
      }
    isCorrect: false
  - snippet: |-
      export interface Env {
        TELEGRAM_BOT_TOKEN: string;
        S3_ACCESS_KEY_ID: string;
        S3_SECRET_ACCESS_KEY: string;
      }

      export async function handle(request: Request, env: Env) {
        const token = env.TELEGRAM_BOT_TOKEN;
        if (!token) {
          throw new Error("Missing required binding: TELEGRAM_BOT_TOKEN");
        }
        return fetch(`https://api.telegram.org/bot${token}/getMe`);
      }
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
