title: Keep database credentials server-side only
rule: >-
  Postgres connection strings and credentials must be read from server-only
  environment variables (e.g. `DATABASE_URL`, `PGPASSWORD`) and must never be
  prefixed with `NEXT_PUBLIC_`, hardcoded, or referenced from client components.
  Any module that constructs a `pg` Pool/Client or reads these variables must be
  server-only: add `import 'server-only'` at the top of the file and keep it out
  of `"use client"` components. Reject inline credentials such as
  `postgres://user:password@host/db` in source files.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      "use client";
      import { Pool } from 'pg';

      const pool = new Pool({
        connectionString: process.env.NEXT_PUBLIC_DATABASE_URL,
      });
    isCorrect: false
  - snippet: |-
      import 'server-only';
      import { Pool } from 'pg';

      const pool = new Pool({
        connectionString: process.env.DATABASE_URL,
      });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
