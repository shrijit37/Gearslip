title: Load all secrets from validated environment variables
rule: >-
  Never hardcode credentials, API keys, JWT signing secrets, or database
  connection strings in source. Read them from process.env (populated by dotenv
  at startup) and fail fast at boot if a required secret is missing or empty.
  This repo already depends on dotenv, jsonwebtoken, openai, and mongoose, so
  all of these values (JWT_SECRET, MONGODB_URI/ATLAS connection string,
  OPENAI_API_KEY, bcrypt pepper) must come from the environment, never from
  literal strings, defaults, or committed .env files.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      const jwtSecret = process.env.JWT_SECRET;
      if (!jwtSecret) throw new Error('JWT_SECRET is not configured');
      const openai = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });
    isCorrect: true
  - snippet: |-
      const jwtSecret = 'educontext-dev-secret';
      const openai = new OpenAI({ apiKey: 'sk-proj-abc123' });
      const uri = 'mongodb+srv://admin:P@ssw0rd@cluster0.mongodb.net/vidyaai';
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
