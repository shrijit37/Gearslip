title: Never hardcode database credentials or DSNs
rule: >-
  PostgreSQL connection strings, passwords, and other credentials must never be
  hardcoded in Go source. Read them from environment variables (e.g.
  DATABASE_URL, PGHOST/PGUSER/PGPASSWORD) or a dedicated secrets loader, and
  fail fast if required values are missing. This applies to
  pgxpool.New/ParseConfig arguments, config structs, and test fixtures.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      dsn := os.Getenv("DATABASE_URL")
      if dsn == "" {
          return fmt.Errorf("DATABASE_URL is not set")
      }
      cfg, err := pgxpool.ParseConfig(dsn)
      if err != nil {
          return fmt.Errorf("invalid DATABASE_URL: %w", err)
      }
      pool, err := pgxpool.NewWithConfig(ctx, cfg)
    isCorrect: true
  - snippet: >-
      pool, err := pgxpool.New(ctx,
      "postgres://admin:s3cr3t@prod-db:5432/billgen?sslmode=disable")

      if err != nil {
          log.Fatal(err)
      }
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
