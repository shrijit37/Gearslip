title: Load bot credentials and tokens from the environment, never hardcode them
rule: >-
  Any secret used by the bot (Telegram/Discord bot tokens, API keys, proxy
  credentials, database URLs) must be read at runtime from environment variables
  or a secret manager (e.g. os.environ / os.getenv with an explicit failure when
  missing, or a settings object populated from env). Committing literal tokens,
  passwords, or keys in .py, .toml, .yaml, .json, or .env files checked into the
  repository is not allowed. Also do not log or print secret values. When a
  required secret is absent, fail fast with a clear error instead of falling
  back to a default value.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      BOT_TOKEN = "1234567890:AAH-hardcoded-token-value"
      bot = Bot(token=BOT_TOKEN)
    isCorrect: false
  - snippet: |-
      import os

      BOT_TOKEN = os.environ["BOT_TOKEN"]  # raises KeyError early if unset
      bot = Bot(token=BOT_TOKEN)
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
