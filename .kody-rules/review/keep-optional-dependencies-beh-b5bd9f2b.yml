title: Keep optional dependencies behind their feature gates
rule: >-
  Every use of a dependency that is optional in Cargo.toml (rodio, tokio, flume,
  rustfft, reqwest, rand, serde, serde_json, anyhow, toml, image, ratatui-image,
  color-thief, tui-textarea-2, souvlaki, winit, windows-win) must be enclosed in
  `#[cfg(feature = "streaming")]` / `#[cfg(feature = "txc")]` (or a shared cfg
  alias), including `use` statements, types in signatures, and platform-specific
  code. New modules must state which feature owns them so that `cargo build
  --no-default-features --features txc` still compiles and `cargo check
  --all-targets` stays green for the advertised feature set.
severity: medium
scope: pull-request
path: '**/*'
examples:
  - snippet: |-
      use rodio::OutputStream;
      use souvlaki::{MediaControls, PlatformConfig};

      pub fn play(path: &str) -> anyhow::Result<()> { /* ... */ }
    isCorrect: false
  - snippet: |-
      #[cfg(feature = "streaming")]
      use rodio::OutputStream;
      #[cfg(feature = "streaming")]
      use souvlaki::{MediaControls, PlatformConfig};

      #[cfg(feature = "streaming")]
      pub fn play(path: &str) -> anyhow::Result<()> { /* ... */ }
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
