title: Validate all untrusted input and external responses with Zod at the boundary
rule: >-
  Parse every value that crosses a trust boundary with a Zod schema before using
  it: HTTP request bodies/query/params, queue and job payloads, and responses
  returned by axios calls to external services (e.g. yfinance-ts or any
  market-data provider). Do not use `as SomeType` casts, non-null assertions, or
  unchecked destructuring on external data. Define the schema next to the
  handler or in a shared package, infer the TypeScript type from it, and return
  a 400/502 with the flattened Zod error when parsing fails rather than letting
  malformed data flow deeper into the app.
severity: high
scope: file
path: '**/*'
examples:
  - snippet: |-
      app.post("/api/watchlist", async (req, res) => {
        const symbol = (req.body as { symbol: string }).symbol;
        const quote = await axios.get(`https://api.example.com/quote/${symbol}`);
        res.json({ price: quote.data.price });
      });
    isCorrect: false
  - snippet: >-
      import { z } from "zod";


      const bodySchema = z.object({ symbol: z.string().min(1).max(12) });

      const quoteSchema = z.object({ price: z.number().finite(), currency:
      z.string() });


      app.post("/api/watchlist", async (req, res) => {
        const parsed = bodySchema.safeParse(req.body);
        if (!parsed.success) {
          return res.status(400).json({ error: parsed.error.flatten() });
        }

        const response = await axios.get(`https://api.example.com/quote/${parsed.data.symbol}`);
        const quote = quoteSchema.safeParse(response.data);
        if (!quote.success) {
          return res.status(502).json({ error: "Unexpected upstream payload" });
        }

        res.json({ price: quote.data.price });
      });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
