title: Load secrets from environment or config, never hardcode or log them
rule: >-
  API keys, database URLs, bearer tokens, signing keys, and similar credentials
  must be read at runtime from environment variables or an external config
  source (e.g. `std::env::var`, `dotenvy`) and must never appear as string
  literals in source, test fixtures, or example snippets committed to the repo.
  Secrets must also never be included in tracing fields, error messages, or
  `Display`/`Debug` output; wrap them in a redacting newtype or log only a
  fingerprint (e.g. last 4 chars or a hash). Fail fast with a clear error when a
  required secret is missing rather than falling back to a default.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      const UPSTREAM_TOKEN: &str = "sk_live_51H8xQ2abc123";
      let client = reqwest::Client::builder()
          .default_headers(HeaderMap::from_iter([(
              AUTHORIZATION,
              HeaderValue::from_static(&format!("Bearer {UPSTREAM_TOKEN}")),
          )]))
          .build()?;
    isCorrect: false
  - snippet: >-
      let token = std::env::var("GATEFLOW_UPSTREAM_TOKEN")
          .map_err(|_| anyhow::anyhow!("GATEFLOW_UPSTREAM_TOKEN is not set"))?;
      let mut headers = HeaderMap::new();

      headers.insert(AUTHORIZATION, HeaderValue::from_str(&format!("Bearer
      {token}"))?);

      let client = reqwest::Client::builder().default_headers(headers).build()?;
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
