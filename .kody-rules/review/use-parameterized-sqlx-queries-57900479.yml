title: Use parameterized sqlx queries instead of string-built SQL
rule: >-
  Never build SQL by interpolating values into a string (format!, push_str,
  concat!, etc.) before passing it to sqlx. Always use bound parameters
  (`sqlx::query(...).bind(...)`, `query_as!`, or
  `sqlx::query_as(...).bind(...)`) so user-controlled input from axum handlers
  cannot alter query structure. Dynamic identifiers (table/column names) must be
  selected from a fixed allow-list, never taken directly from request data.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      let sql = format!("SELECT id, name FROM users WHERE id = '{}'", user_id);
      let row = sqlx::query(&sql).fetch_one(&pool).await?;
    isCorrect: false
  - snippet: >-
      let row = sqlx::query_as::<_, User>("SELECT id, name FROM users WHERE id =
      ?")
          .bind(user_id)
          .fetch_one(&pool)
          .await?;
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
