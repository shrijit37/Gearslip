title: >-
  Load all credentials and AI provider keys from environment variables, never
  from source or config files
rule: >-
  Any secret (AI/LLM provider API keys, database URLs, JWT/invite signing
  secrets, SMTP or storage credentials) must be read from process.env at runtime
  and never hardcoded in JS/TS source, JSON config, Makefiles, or committed .env
  files. Provide a committed .env.example with placeholder values only, and add
  .env* (except .env.example) to .gitignore. If a secret is missing at startup,
  throw immediately instead of falling back to a default or empty string.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      const openai = new OpenAI({ apiKey: 'sk-live-abc123' });
      const jwtSecret = 'rehearse-secret';
    isCorrect: false
  - snippet: |-
      const apiKey = process.env.OPENAI_API_KEY;
      if (!apiKey) throw new Error('OPENAI_API_KEY is required');
      const openai = new OpenAI({ apiKey });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
