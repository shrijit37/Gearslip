title: Persist tokens and credentials only with expo-secure-store
rule: >-
  Never store authentication tokens, refresh tokens, session IDs, API keys,
  passwords, or any user credential in AsyncStorage, module-level variables,
  Zustand/Redux persistence, or unencrypted files. Use expo-secure-store
  (setItemAsync/getItemAsync/deleteItemAsync) for all sensitive values, and read
  them only at the moment of use. AsyncStorage may be used only for
  non-sensitive UI/preference data (theme, onboarding flags, cached non-PII
  lists).
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      import * as SecureStore from 'expo-secure-store';

      export async function saveSession(token: string) {
        await SecureStore.setItemAsync('auth.accessToken', token);
      }

      export async function getSession() {
        return SecureStore.getItemAsync('auth.accessToken');
      }
    isCorrect: true
  - snippet: |-
      import AsyncStorage from '@react-native-async-storage/async-storage';

      export async function saveSession(token: string) {
        await AsyncStorage.setItem('authToken', token);
      }
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
