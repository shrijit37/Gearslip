title: Load all auth secrets from environment with fail-fast validation
rule: >-
  Every secret used by this service (BETTER_AUTH_SECRET, DATABASE_URL,
  RESEND_API_KEY, OAuth/provider client secrets, SMTP credentials) must be read
  from process.env at runtime and validated once during startup. Hardcoded
  literals, committed default values, and silent fallbacks such as
  `process.env.BETTER_AUTH_SECRET || 'dev-secret'` are prohibited: if a required
  variable is missing or too short, the process must throw and exit before
  serving traffic. Keep only non-sensitive placeholders (e.g. `.env.example`
  with empty values) in the repository.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: |-
      export const auth = betterAuth({
        secret: "dev-secret-change-me",
        database: { connectionString: "postgres://user:pass@localhost:5432/auth" },
        emailAndPassword: { enabled: true },
      });
    isCorrect: false
  - snippet: |-
      function requireEnv(name: string): string {
        const value = process.env[name];
        if (!value || value.length < 32) {
          throw new Error(`Missing or weak required environment variable: ${name}`);
        }
        return value;
      }

      const BETTER_AUTH_SECRET = requireEnv("BETTER_AUTH_SECRET");
      const DATABASE_URL = requireEnv("DATABASE_URL");
      const RESEND_API_KEY = requireEnv("RESEND_API_KEY");

      export const auth = betterAuth({
        secret: BETTER_AUTH_SECRET,
        database: { connectionString: DATABASE_URL },
        emailAndPassword: { enabled: true },
      });
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
