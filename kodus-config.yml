version: 2.0

# Kody only reads this file from the default branch, and only after the repository-level
# "Prefer kodus-config.yml settings" switch is enabled in Code review -> General.

kodusConfigFileOverridesWebPreferences: true
automatedReviewActive: true
showStatusFeedback: true
reviewCadence:
  type: automatic
reviewMode: heavy
runOnDraft: false
pullRequestApprovalActive: true
isRequestChangesActive: true
enableCommittableSuggestions: true
crossFileDependenciesAnalysis: true

reviewOptions:
  bug: true
  performance: true
  security: true
  business_logic: true
  cross_file: true
  repoInstructionsEnabled: true

suggestionControl:
  groupingMode: full
  applyFiltersToKodyRules: false
  limitationType: pr
  maxSuggestions: 100
  severityLevelFilter: low
  severityLimits:
    low: 0
    medium: 0
    high: 0
    critical: 0

summary:
  generatePRSummary: false
  behaviourForNewCommits: 'none'
  behaviourForExistingDescription: 'complement'
  customInstructions: ''

ignorePaths:
  - 'build/**'
  - '**/*.html'
  - '**/*.lock'
