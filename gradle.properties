# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Reuse task outputs between builds. gradle/actions/setup-gradle caches the Gradle user home,
# but Gradle only reads and writes that cache when this flag is on. Without it every CI build
# recompiles Kotlin and reruns R8 even when the sources have not changed.
org.gradle.caching=true
# Independent tasks (resources, dexing, APK packaging of the ABIs) can run concurrently.
org.gradle.parallel=true
# Skip re-evaluating build scripts on repeat invocations. The git reads are ValueSource-backed (a
# new commit invalidates the entry) and the monotonic version-code clock is too, through
# BuildClockValueSource in gearslip/build.gradle.kts. Use --no-configuration-cache for a one-off bypass.
org.gradle.configuration-cache=true
# Store independent projects' configuration in parallel too; needs org.gradle.parallel above.
# Incubating in Gradle 9, harmless where it is not used.
org.gradle.configuration-cache.parallel=true
# Kotlin compilation is incremental by default in Kotlin 2.x; stated explicitly so a future
# default change is a deliberate decision rather than a silent build slowdown.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.dependency.useConstraints=false
# Where opted-in phones send their daily usage note (stats-worker/). Blank sends nothing.
gearslipStatsUrl=https://gearslip-stats.gearslip.workers.dev
