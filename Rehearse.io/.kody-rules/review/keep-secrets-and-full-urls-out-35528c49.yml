title: Keep secrets and full URLs out of every log and error path
rule: >-
  An API key or a URL carrying one must never be interpolated into a log line, a
  thrown error, a close reason or a response body. Where an upstream sends
  free-form text that ends up in a log (e.g. `timeLeft`), validate its shape
  first and log a placeholder otherwise. Assert the redaction in the test suite
  by capturing every emitted log line and checking neither the key nor the URL
  appears.
severity: high
scope: file
examples:
  - snippet: >-
      const { timeLeft } = frame.goAway;

      // Noncompliant: arbitrary provider text reaches our log

      console.log(`[live] goAway received (timeLeft=${timeLeft}) from
      ${upstreamUrl}`);
    isCorrect: false
  - snippet: >-
      const { timeLeft } = frame.goAway;

      const shaped = typeof timeLeft === "string" &&
      /^\d+(\.\d+)?s$/.test(timeLeft) ? timeLeft : "?";

      // Compliant: only a value in the expected shape is logged

      console.log(`[live] goAway received (timeLeft=${shaped})`);
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
