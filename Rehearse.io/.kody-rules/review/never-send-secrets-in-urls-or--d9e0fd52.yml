title: >-
  Never send secrets in URLs or query strings; use headers where the API allows
  it
rule: >-
  Verify that API keys, tokens and other credentials travel in headers
  (`x-goog-api-key`, `Authorization`) rather than in the URL or query string,
  which leaks them into logs, proxies, error messages and referrers. Where the
  API offers no alternative (e.g. a WebSocket endpoint that only authenticates
  via `?key=`), the request must be proxied server-side so the URL never reaches
  the client, must not be logged or embedded in error messages, and must be
  hard-coded or production-gated rather than env-overridable. Prefer fixed
  endpoint constants and `redirect: "error"` so a 3xx cannot replay the
  credential against another host.
severity: critical
scope: file
examples:
  - snippet: >-
      const url =
      `https://example.com/v1/models/${MODEL}:generateContent?key=${apiKey}`;

      const res = await fetch(url); // Noncompliant: key in the query string
    isCorrect: false
  - snippet: |-
      const res = await fetch(`${LIVE_SCORING_ENDPOINT}:generateContent`, {
        method: "POST",
        headers: { "x-goog-api-key": apiKey, "content-type": "application/json" },
        redirect: "error",
      }); // Compliant: key in a header, redirects refused
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
