title: Do not truncate the payload a downstream consumer must receive whole
rule: >-
  When building a composed string (prompt, instruction, request body) around
  user content, shorten the fixed parts — never the user content. A `slice(0,
  MAX)` applied to the whole string silently cuts the text that is later scored,
  persisted or spoken. Spend the budget on the preamble: `preamble.slice(0, MAX
  - content.length) + content`.
severity: high
scope: file
examples:
  - snippet: >-
      export function buildLiveInstruction(targetRole: string, question:
      string): string {
          // Noncompliant: a long question is truncated and the rubric scores a different text
          return `You are a ${targetRole} interview coach. The question is: "${question}"`.slice(
              0,
              LIVE_MAX_INSTRUCTION_CHARS,
          );
      }
    isCorrect: false
  - snippet: >-
      export function buildLiveInstruction(targetRole: string, question:
      string): string {
          const asked = `The question for this turn is: "${question}"`;
          const preamble = `You are a ${targetRole} interview coach.`;
          // Compliant: the budget is spent on the preamble; the question survives whole
          return preamble.slice(0, Math.max(0, LIVE_MAX_INSTRUCTION_CHARS - asked.length)) + asked;
      }
    isCorrect: true
inheritance:
  inheritable: true
  exclude: []
  include: []
enabled: false
