name: Promote a stable release

# Main pushes are prereleases: the stable updater ignores them. A hand-written v* tag is the
# promotion signal, and the release it creates is the only one the stable channel offers.
on:
  push:
    tags:
      - 'v*'

jobs:
  promote:
    # CI-generated tags carry "-<count>-g<sha>". Only a hand-written version tag promotes.
    if: ${{ !contains(github.ref_name, '-g') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout before the local action so GitHub can load its definition from disk, and keep
      # the tag history gitVersion needs to name this build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/gearslip-build
        id: build
        with:
          # A promoted APK must carry the key an installed Gearslip already trusts, or Android
          # refuses to install it. The shared action fails here when the key is missing.
          signing: required
          keystore-b64: ${{ secrets.UPDATE_KEYSTORE_B64 }}
          store-password: ${{ secrets.UPDATE_STORE_PASSWORD }}
          key-alias: ${{ secrets.UPDATE_KEY_ALIAS }}
          key-password: ${{ secrets.UPDATE_KEY_PASSWORD }}

      - name: Write release body
        run: |
          # The sequence Gradle compiled into the APK (minutes since the epoch) is published
          # with the release so the app can refuse an out-of-order downgrade from a later dev
          # build. The shared action computed it once for both the build and this comment.
          {
            echo "<!-- gearslip-version-code: ${{ steps.build.outputs.seq }} -->"
            cat .github/release-notes.md
          } > release-body.md

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          generate_release_notes: true
          files: build/Gearslip-*-debug.apk
          prerelease: false
