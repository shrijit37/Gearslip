name: Promote a stable release

# Main pushes are prereleases: the stable updater ignores them. A hand-written v* tag is the
# promotion signal, and the release it creates is the only one the stable channel offers.
on:
  push:
    tags:
      - 'v*'

jobs:
  promote:
    # CI-generated tags carry "-<count>-g<sha>". Only a hand-written version tag promotes.
    if: ${{ !contains(github.ref_name, '-g') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gitVersion names the build after the newest tag, so it needs the tag history.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Same four secrets as release.yml: a promoted build must carry the key an installed
      # Gearslip already trusts, or Android refuses to install it.
      - name: Write stable signing config
        env:
          UPDATE_KEYSTORE_B64: ${{ secrets.UPDATE_KEYSTORE_B64 }}
          UPDATE_STORE_PASSWORD: ${{ secrets.UPDATE_STORE_PASSWORD }}
          UPDATE_KEY_ALIAS: ${{ secrets.UPDATE_KEY_ALIAS }}
          UPDATE_KEY_PASSWORD: ${{ secrets.UPDATE_KEY_PASSWORD }}
        run: |
          if [ -z "$UPDATE_KEYSTORE_B64" ]; then
            echo "::error::UPDATE_KEYSTORE_B64 is not set; a promoted build cannot update an installed Gearslip."
            exit 1
          fi
          echo "$UPDATE_KEYSTORE_B64" | base64 --decode > gearslip-release.jks
          python3 - <<'PY'
          import os

          def escape(value):
              return (value.replace('\\', '\\\\').replace(':', '\\:')
                           .replace('=', '\\=').replace('\n', '\\n'))

          props = {
              'STORE_PASSWORD': 'storePassword',
              'KEY_ALIAS': 'keyAlias',
              'KEY_PASSWORD': 'keyPassword',
          }
          with open('keystore.properties', 'w') as out:
              out.write('storeFile=gearslip-release.jks\n')
              for env, prop in props.items():
                  out.write('%s=%s\n' % (prop, escape(os.environ['UPDATE_' + env])))
          PY

      - name: Build stable APK
        run: ./gradlew :gearslip:assembleDebug --no-daemon -PgearslipChannel=stable -PgearslipBuildSha="$(git rev-parse --short=7 HEAD)"

      - name: Locate APKs
        run: |
          compgen -G 'build/Gearslip-*-debug.apk' > /dev/null || { echo "no split APKs in build/"; exit 1; }
          ls -lh build/Gearslip-*-debug.apk

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: build/Gearslip-*-debug.apk
          prerelease: false
