name: Build APK and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Release assets are shared state: release.yml and promote.yml can both publish the same tag, so
# they share one group. Never cancel an in-flight upload after the release was created but before
# all APKs landed.
concurrency:
  group: release-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A local action has to exist on disk before GitHub can load it, so every caller checks
      # out first. Full history gives gitVersion its hand-written version tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # JDK, Gradle cache and (when the secrets exist) the stable signing key all live in one
      # action shared with the dev and promotion workflows. A fork without the secrets gets a
      # throwaway signature here and a warning; publishing still works from the UI.
      - uses: ./.github/actions/gearslip-build
        with:
          signing: optional
          keystore-b64: ${{ secrets.UPDATE_KEYSTORE_B64 }}
          store-password: ${{ secrets.UPDATE_STORE_PASSWORD }}
          key-alias: ${{ secrets.UPDATE_KEY_ALIAS }}
          key-password: ${{ secrets.UPDATE_KEY_PASSWORD }}
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Compute release tag
        id: version
        run: |
          # Ignore tags generated by this workflow (they contain "-g") so names don't chain.
          tag=$(git describe --tags --match 'v*' --exclude '*-g*' --abbrev=7 2>/dev/null \
            || echo "v0.0.0-$(git rev-parse --short=7 HEAD)")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A hand-written v* tag on this commit belongs to promote.yml. Publishing a prerelease
          # on that same tag could flip the stable release back to a prerelease, which the stable
          # updater ignores, so leave the tag to the promotion workflow.
          if git describe --tags --match 'v*' --exclude '*-g*' --exact-match HEAD >/dev/null 2>&1; then
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tagged release
        if: steps.version.outputs.promoted != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: build/Gearslip-*-debug.apk
          # Every build starts as a pre-release; promote it on GitHub after testing.
          prerelease: true
