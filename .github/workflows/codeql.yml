name: CodeQL

# Kotlin can only be scanned while it compiles, so this builds the debug app, the same way
# release.yml does but without a signing key. Workflow files need no build.
on:
  push:
    branches: [main, experimental]
  pull_request:
  workflow_dispatch:

# Every push and PR already scans the changed code. A weekly CodeQL run rebuilds unchanged Kotlin;
# Trivy's cheap filesystem scan is the scheduled safety net instead.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Only the manual build needs a JDK and Gradle, and they share the publishing workflows'
      # setup action. No signing key: the scan needs compiled Kotlin, not an installable APK.
      # PR code controls the build script, so PR runs get neither the cache-authentication key
      # nor write access to the cache the publishing workflows restore.
      - if: matrix.build-mode == 'manual'
        uses: ./.github/actions/gearslip-build
        with:
          signing: none
          build: false
          gradle-encryption-key: ${{ github.event_name != 'pull_request' && secrets.GRADLE_ENCRYPTION_KEY || '' }}

      # CodeQL scans Kotlin as it compiles. R8 runs after that and produces no source facts, and
      # the scan needs no other ABIs, so skip both. Nothing from this build is published.
      - if: matrix.build-mode == 'manual'
        run: ./gradlew :gearslip:assembleDebug --no-daemon -PnoR8 -PgearslipAbi=arm64-v8a

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
