name: CodeQL

# Kotlin can only be scanned while it compiles, so this builds the debug app, the same way
# release.yml does but without a signing key. Workflow files need no build.
on:
  push:
    branches: [main, experimental]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Only the manual build needs a JDK and Gradle, and they share the publishing workflows'
      # setup action. No signing key: the scan needs compiled Kotlin, not an installable APK.
      - if: matrix.build-mode == 'manual'
        uses: ./.github/actions/gearslip-build
        with:
          signing: none
          build: false

      # CodeQL scans Kotlin as it compiles. R8 runs after that and produces no source facts,
      # so skipping it here shortens the scan without changing what is published.
      - if: matrix.build-mode == 'manual'
        run: ./gradlew :gearslip:assembleDebug --no-daemon -PnoR8

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
