name: Kotlin checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kotlin-checks:
    name: kotlin-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run unit tests and assemble debug APK
        run: ./gradlew :gearslip:testDebugUnitTest :gearslip:assembleDebug --no-daemon
